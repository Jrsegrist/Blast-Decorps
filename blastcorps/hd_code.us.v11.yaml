# splat's split of hd_code, the game: text (to 0xA4410) and data, inflated by
# init's boot from the ROM's hd_code_text and hd_code_data members
options:
  basename: hd_code.us.v11
  target_path: hd_code.us.v11.bin          # the inflated segment (top-level `make extract`)
  base_path: .
  src_path: src.us.v11
  compiler: IDO
  symbol_addrs_path: symbol_addrs.hd_code.us.v11.txt
  undefined_funcs_auto_path: undefined_funcs_auto.hd_code.us.v11.txt
  undefined_syms_auto_path: undefined_syms_auto.hd_code.us.v11.txt
  find_file_boundaries: true
  create_detected_syms: true
segments:
  - name: hd_code
    type: code
    start: 0x0
    vram: 0x802447C0
    subsegments:
    - [0x00000, c, hd_code/00000]
    - [0x12D80, c, hd_code/12D80]
    - [0x13A70, c, hd_code/13A70]
    - [0x14B30, c, hd_code/14B30]
    - [0x168B0, c, hd_code/168B0] # font.c (from its assert strings)
