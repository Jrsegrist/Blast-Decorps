  # and the offsets in the file names, are us.v11's)
  build_path: build/us.v10
  asm_path: asm/us.v10
  asset_path: assets/us.v10
  basename: hd_code.us.v10
  target_path: hd_code.us.v10.bin          # the inflated segment (top-level `make extract`)
  base_path: .
  src_path: src.us.v11
  compiler: IDO
  symbol_addrs_path: symbol_addrs.hd_code.us.v10.txt
  undefined_funcs_auto_path: undefined_funcs_auto.hd_code.us.v10.txt
  undefined_syms_auto_path: undefined_syms_auto.hd_code.us.v10.txt
  find_file_boundaries: true
  create_detected_syms: true
